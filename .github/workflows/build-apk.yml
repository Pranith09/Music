name: Build Offline Music App APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Accept Android Licenses & Doctor
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Split ARM64 APK for Realme Narzo 60
        run: flutter build apk --release --split-per-abi || true

      - name: Prepare APK Outputs
        run: |
          mkdir -p output-apks
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk output-apks/Music-Universal-v1.0.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output-apks/Music-arm64-v8a-RealmeNarzo60.apk
          fi

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Music-Android-APKs
          path: output-apks/*
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: Music v1.0.0 (Build ${{ github.run_number }})
          body: |
            ### 🎵 Music Offline Player - Build ${{ github.run_number }}
            **Download the APK for your phone:**
            - Realme Narzo 60 5G: `Music-arm64-v8a-RealmeNarzo60.apk`
            - Universal Android: `Music-Universal-v1.0.apk`
          files: output-apks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
