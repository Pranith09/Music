name: Build Offline Music App APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Pre-cache and Doctor
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Organize APK Output
        run: |
          mkdir -p output-apks
          cp build/app/outputs/flutter-apk/app-release.apk output-apks/Music-RealmeNarzo60.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-Android-APK
          path: output-apks/Music-RealmeNarzo60.apk
          retention-days: 30
