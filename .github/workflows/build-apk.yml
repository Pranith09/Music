name: Build Offline Music App APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Official Android Native Project
        run: |
          flutter config --no-analytics
          # Automatically generate official Flutter Android platform files
          flutter create . --org com.pranith --project-name music --platforms android

      - name: Configure Android Permissions and MinSdk via Python
        run: |
          python3 - << 'EOF'
          import os
          import re

          # 1. Update AndroidManifest.xml with Audio Permissions and AudioService
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              permissions = """
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              """

              services = """
                  <service android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>
                  <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>
              """

              if "READ_MEDIA_AUDIO" not in content:
                  content = content.replace("<application", permissions + "\n    <application", 1)
              
              if "com.ryanheise.audioservice.AudioService" not in content:
                  content = content.replace("</application>", services + "\n    </application>")
              
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("AndroidManifest.xml successfully configured!")

          # 2. Update build.gradle for minSdk 23
          for gradle_file in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(gradle_file):
                  with open(gradle_file, "r", encoding="utf-8") as f:
                      g_content = f.read()
                  g_content = re.sub(r'minSdkVersion\s*=?\s*\S+', 'minSdkVersion = 23', g_content)
                  g_content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', g_content)
                  with open(gradle_file, "w", encoding="utf-8") as f:
                      f.write(g_content)
                  print(f"Updated {gradle_file} with minSdk 23!")
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Find & Organize APK Output
        run: |
          mkdir -p output-apks
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find build -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            cp "$APK_PATH" output-apks/Music-RealmeNarzo60.apk
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-Android-APK
          path: output-apks/Music-RealmeNarzo60.apk
          retention-days: 30
